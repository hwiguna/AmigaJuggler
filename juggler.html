<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amiga Juggler</title>
<style>
  :root { --fg: #e8e8f0; --dim: rgba(232,232,240,.6); --panel: rgba(10,10,30,.45); }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: fixed; left: 0; top: 0; display: block; width: 100vw; height: 100vh; }
  #c { touch-action: none; cursor: grab; }
  #c:active { cursor: grabbing; }
  #ham { pointer-events: none; display: none; }
  canvas.pixelated { image-rendering: pixelated; image-rendering: crisp-edges; }
  #hud {
    position: fixed; left: 12px; bottom: 12px; padding: 8px 12px; border-radius: 8px;
    background: var(--panel); color: var(--fg); font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace;
    pointer-events: none; user-select: none; max-width: calc(100vw - 48px);
  }
  #hud b { color: #fff; }
  #hud .dim { color: var(--dim); }
  #modes { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; pointer-events: auto; }
  #modes button {
    font: inherit; color: var(--fg); background: rgba(255,255,255,.08); cursor: pointer;
    border: 1px solid rgba(255,255,255,.25); border-radius: 5px; padding: 2px 8px;
  }
  #modes button:hover { background: rgba(255,255,255,.18); }
  #modes button[aria-pressed="true"] { background: #e8e8f0; color: #10102a; border-color: #e8e8f0; }
  #hud .row { display: flex; align-items: center; gap: 6px; }
  #hudToggle {
    pointer-events: auto; cursor: pointer; font: inherit; line-height: 1; color: var(--fg);
    background: none; border: 1px solid rgba(255,255,255,.25); border-radius: 4px;
    width: 20px; height: 20px; padding: 0; flex: none;
  }
  #hudToggle:hover { background: rgba(255,255,255,.18); }
  #hud.collapsed { padding: 6px; }
  #hud.collapsed .more { display: none; }
  #err { position: fixed; inset: 0; display: none; place-items: center; color: #fff; font: 16px sans-serif; padding: 16px; text-align: center; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="ham" class="pixelated" width="320" height="200"></canvas>
<div id="hud">
  <div class="row">
    <button id="hudToggle" aria-expanded="true" aria-controls="hudMore" title="Hide controls (H)">▾</button>
    <span class="more"><b>The Juggler</b> <span class="dim">— Eric Graham, 1986 · real-time WebGL re-trace</span></span>
  </div>
  <div id="hudMore" class="more">
    <div id="modes" role="group" aria-label="Render mode"></div>
    <div id="stats">…</div>
    <div class="dim">drag: orbit · wheel/pinch: zoom · double-click: reset · space: pause · 0–9: speed · m: mute · r: render mode · h: hide panel · click for sound</div>
  </div>
</div>
<div id="err"></div>

<script id="vs" type="x-shader/x-vertex">#version 300 es
void main() {
  vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}
</script>

<script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
precision highp int;

#define NS 79
#define NG 6

uniform vec2  uRes;
uniform vec3  uCam, uFwd, uRight, uUp;
uniform float uFl;        // focal length (original: 0.028 * 35)
uniform vec2  uPlane;     // image-plane size (original: 1.0 x 0.75)
uniform int   uQuant;     // 1 = 4 bits per channel, like the original's 16-level output
uniform float uFilter;    // 1 = fade far checkers to avoid moire, 0 = raw 1986 aliasing
uniform float uPixAng;    // approx angular size of a pixel, for horizon filtering
uniform int   uSamples;
uniform float uLampK;     // lamp exposure factor (original "lampfac")

uniform vec4 uSph[NS];    // xyz = center, w = radius
uniform vec4 uCol[NS];    // rgb = color, a = material (0 dull, 1 bright, 2 mirror)
uniform vec4 uGB[NG];     // bounding spheres of body groups
uniform ivec2 uGR[NG];    // [start, end) sphere ranges of body groups

out vec4 outColor;

// Scene constants straight from robot.dat (z is up)
const vec3 LAMP  = vec3(-100.0, 50.0, 150.0);
const float LAMPR = 15.0;
const vec3 G0  = vec3(1.5, 1.5, 0.0);
const vec3 G1  = vec3(0.0, 1.5, 0.0);
const vec3 AMB = vec3(0.25);
const vec3 ZEN = vec3(0.1, 0.1, 1.0);
const vec3 HOR = vec3(0.7, 0.7, 1.0);

float hitSphere(vec3 ro, vec3 rd, vec4 s) {
  vec3 oc = ro - s.xyz;
  float b = dot(oc, rd);
  float c = dot(oc, oc) - s.w * s.w;
  float h = b * b - c;
  if (h <= 0.0) return -1.0;
  h = sqrt(h);
  float t = -b - h;
  if (t < 1e-4) t = -b + h;
  return t > 1e-4 ? t : -1.0;
}

bool hitBound(vec3 ro, vec3 rd, vec4 s) {
  vec3 oc = ro - s.xyz;
  float b = dot(oc, rd);
  float c = dot(oc, oc) - s.w * s.w;
  float h = b * b - c;
  return h > 0.0 && (-b + sqrt(h)) > 0.0;
}

float nearest(vec3 ro, vec3 rd, out int id) {
  float tm = 1e20; id = -1;
  for (int i = 0; i < 3; i++) {
    float t = hitSphere(ro, rd, uSph[i]);
    if (t > 0.0 && t < tm) { tm = t; id = i; }
  }
  for (int g = 0; g < NG; g++) {
    if (!hitBound(ro, rd, uGB[g])) continue;
    for (int i = uGR[g].x; i < uGR[g].y; i++) {
      float t = hitSphere(ro, rd, uSph[i]);
      if (t > 0.0 && t < tm) { tm = t; id = i; }
    }
  }
  return tm;
}

// Shadow test toward the lamp, skipping the sphere being shaded (as the original does).
bool occluded(vec3 ro, vec3 rd, int skip) {
  for (int i = 0; i < 3; i++)
    if (i != skip && hitSphere(ro, rd, uSph[i]) > 0.0) return true;
  for (int g = 0; g < NG; g++) {
    if (!hitBound(ro, rd, uGB[g])) continue;
    for (int i = uGR[g].x; i < uGR[g].y; i++)
      if (i != skip && hitSphere(ro, rd, uSph[i]) > 0.0) return true;
  }
  return false;
}

vec3 sky(vec3 rd) {
  float s2 = rd.z * rd.z;
  return HOR * (1.0 - s2) + ZEN * s2;
}

// Eric Graham's "gingham": 3-unit tiles, including his off-by-one on negative axes.
vec3 gingham(vec3 p, float footprint) {
  float x = p.x, y = p.y;
  int kx = 0, ky = 0;
  if (x < 0.0) { x = -x; kx = 1; }
  if (y < 0.0) { y = -y; ky = 1; }
  x = min(x, 1e8); y = min(y, 1e8);
  int k = ((int(x) + kx) / 3 + (int(y) + ky) / 3) % 2;
  vec3 c = k == 0 ? G0 : G1;
  // fade to the average tile color where a pixel covers many tiles (avoids horizon moire)
  return mix(c, 0.5 * (G0 + G1), uFilter * smoothstep(0.6, 3.0, footprint));
}

// The original pixbrite(): sky-weighted ambient + inverse-square lamp with hard shadow.
vec3 pixbrite(vec3 p, vec3 n, vec3 col, int skip) {
  vec3 b = (n.z + 1.5) * 0.4 * AMB * col;
  vec3 lp = LAMP - p;
  float cosi = dot(lp, n);
  if (cosi > 0.0) {
    float r = length(lp);
    if (!occluded(p, lp / r, skip)) b += (cosi / (r * r * r)) * uLampK * col;
  }
  return b;
}

// The original glint(): a hard-edged white highlight when the reflection lines up with the lamp.
bool glint(vec3 p, vec3 n, vec3 rd, int self) {
  vec3 lp = LAMP - p;
  if (dot(lp, n) <= 0.0) return false;
  vec3 l = normalize(lp);
  vec3 r = reflect(rd, n);
  float c = dot(l, r);
  if (c * c <= 0.95 || c < 0.0) return false;
  return !occluded(p, l, self);
}

vec3 trace(vec3 ro, vec3 rd) {
  vec3 thr = vec3(1.0);
  float travelled = 0.0;
  for (int depth = 0; depth < 8; depth++) {
    int id;
    float ts = nearest(ro, rd, id);
    float tl = hitSphere(ro, rd, vec4(LAMP, LAMPR));
    if (tl > 0.0 && tl < ts) return thr * vec3(4.0);       // looking straight at the lamp
    if (rd.z < 0.0) {
      float tg = -ro.z / rd.z;
      if (tg > 1e-4 && tg < ts) {
        vec3 p = ro + rd * tg;
        float fp = (travelled + tg) * uPixAng / max(-rd.z, 0.02);
        return thr * pixbrite(p, vec3(0, 0, 1), gingham(p, fp), -1);
      }
    }
    if (id < 0) return thr * sky(rd);
    vec3 p = ro + rd * ts;
    vec3 n = (p - uSph[id].xyz) / uSph[id].w;
    vec4 m = uCol[id];
    if (m.a > 1.5) {                                          // mirror
      if (dot(n, rd) >= 0.0) return vec3(0.0);
      thr *= m.rgb;
      travelled += ts;
      ro = p; rd = reflect(rd, n);
      continue;
    }
    if (m.a > 0.5 && glint(p, n, rd, id)) return thr;          // bright highlight
    return thr * pixbrite(p, n, m.rgb, id);
  }
  return vec3(0.0);
}

void main() {
  vec3 acc = vec3(0.0);
  int ns = uSamples;
  for (int s = 0; s < 4; s++) {
    if (s >= ns) break;
    vec2 off = ns == 1 ? vec2(0.5) :
      (s == 0 ? vec2(0.375, 0.125) : s == 1 ? vec2(0.875, 0.375) :
       s == 2 ? vec2(0.125, 0.625) : vec2(0.625, 0.875));
    vec2 px = gl_FragCoord.xy - 0.5 + off;
    float sx = (px.x / uRes.x - 0.5) * uPlane.x;
    float sy = (px.y / uRes.y - 0.5) * uPlane.y;
    vec3 rd = normalize(uFwd * uFl + sx * uRight + sy * uUp);
    acc += clamp(trace(uCam, rd), 0.0, 1.0);
  }
  vec3 c = acc / float(ns);
  if (uQuant == 1) c = min(floor(c * 16.0 + 0.5), 15.0) / 15.0;
  outColor = vec4(c, 1.0);
}
</script>

<script>
"use strict";
// ---------------------------------------------------------------------------
// Scene: Eric Graham's original robot.dat (public domain w/ attribution).
// Coordinates are z-up; the robot faces -x.
// ---------------------------------------------------------------------------
const C_SKIN  = [1, .7, .7];
const C_HAIR  = [.2, .1, .1];
const C_EYE   = [.1, .1, 1];
const C_RED   = [1, .1, .1];
const C_CHROME = [.9, .9, .9];
const DULL = 0, BRIGHT = 1, MIRROR = 2;

const REST = {
  balls: [[-0.9, -2.1, 5.3], [-1.1, 1.9, 5.9], [-0.4, -1.2, 6.8]],
  ballR: 0.6,
  head: [0, 0, 6.1], headR: 0.5,
  hair: [0.02, 0, 6.12], hairR: 0.5,
  eyes: [[-0.4, 0.2, 6.1], [-0.4, -0.2, 6.1]], eyeR: 0.15,
  neck: [0, 0, 5.5], neckR: 0.2,
  torsoTop: [0, 0, 4.6], torsoTopR: 0.8, torsoBot: [0, 0, 3.3], torsoBotR: 0.6, torsoN: 5,
  // limbs: root (r .2) -6-> joint (r .2) -7-> end (r .1)
  legR: [[0, -0.6, 2.9], [0.2, -0.6, 1.6], [0.4, -0.6, 0]],
  legL: [[0, 0.6, 2.9], [-0.6, 0.6, 1.6], [-0.4, 0.6, 0]],
  armR: [[0, -0.7, 5.1], [-0.2, -1.2, 4.2], [-1.1, -2.0, 4.1]],
  armL: [[0, 0.7, 5.1], [-0.2, 1.2, 4.2], [-1.0, 1.9, 4.8]],
};
const LAMP = [-100, 50, 150];
// original camera
const OBS = [-10, -4, 5.5], ALT = -10, AZ = 20, FOCAL = 0.028 * 35;

// ---- small vector helpers ----
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const len = a => Math.hypot(a[0], a[1], a[2]);
const norm = a => mul(a, 1 / len(a));
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const lerp = (a, b, t) => add(a, mul(sub(b, a), t));
const dist = (a, b) => len(sub(a, b));

// Two-bone IK: returns the middle joint for root A reaching target C, bending toward pole.
function ik(A, C, l1, l2, pole) {
  let d = dist(A, C);
  d = Math.min(Math.max(d, Math.abs(l1 - l2) + 1e-4), l1 + l2 - 1e-4);
  const dir = norm(sub(C, A));
  const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
  const h = Math.sqrt(Math.max(l1 * l1 - a * a, 0));
  const perp = norm(sub(pole, mul(dir, dot(pole, dir))));
  return add(add(A, mul(dir, a)), mul(perp, h));
}

// ---- sphere list builder (same interpolation rule as the .dat format) ----
const sph = new Float32Array(79 * 4), col = new Float32Array(79 * 4);
let ns = 0;
function put(p, r, c, m) {
  sph.set([p[0], p[1], p[2], r], ns * 4);
  col.set([c[0], c[1], c[2], m], ns * 4);
  ns++;
}
function chain(points, radii, counts, c, m) {
  put(points[0], radii[0], c, m);
  for (let s = 0; s < counts.length; s++) {
    const n = counts[s];
    for (let i = 1; i <= n + 1; i++) {
      const t = i / (n + 1);
      put(lerp(points[s], points[s + 1], t), radii[s] + (radii[s + 1] - radii[s]) * t, c, m);
    }
  }
}
// group ranges: head(5), torso(7), legR(16), legL(16), armR(16), armL(16) after 3 balls
const GROUPS = [[3, 8], [8, 15], [15, 31], [31, 47], [47, 63], [63, 79]];
const gb = new Float32Array(GROUPS.length * 4);
function computeBounds() {
  GROUPS.forEach(([s, e], g) => {
    const lo = [1e9, 1e9, 1e9], hi = [-1e9, -1e9, -1e9];
    for (let i = s; i < e; i++) for (let k = 0; k < 3; k++) {
      lo[k] = Math.min(lo[k], sph[i * 4 + k] - sph[i * 4 + 3]);
      hi[k] = Math.max(hi[k], sph[i * 4 + k] + sph[i * 4 + 3]);
    }
    const c = mul(add(lo, hi), 0.5);
    let r = 0;
    for (let i = s; i < e; i++) r = Math.max(r, dist(c, [sph[i * 4], sph[i * 4 + 1], sph[i * 4 + 2]]) + sph[i * 4 + 3]);
    gb.set([c[0], c[1], c[2], r + 1e-3], g * 4);
  });
}

// ---------------------------------------------------------------------------
// Juggling, timed from the original 24 frames (30 fps, 0.8 s loop). Graham's robot
// juggles a 3-ball *shower*: every 0.8 s the -y hand (screen right) throws a ball high
// (1.6 s flight, over and to the left) while the +y hand passes the ball it just caught
// low across to it (0.8 s). Balls never rest: each catch is also a throw. Positions and
// gravity were fitted to the ball paths in the original frames, then nudged so the big
// mirror balls clear the head, chest and each other.
// ---------------------------------------------------------------------------
const LOOP = 0.8;                       // the original 24-frame loop
const HIGH = 2 * LOOP, LOW = LOOP;      // flight times
const GRAV = 11.24;                     // fitted to the original frames: 3.6 units of rise on the high throw
const SIDE = [-1, 1];                   // hand 0 is -y (throws high), hand 1 is +y (passes low)
const BALL_AT = [[-1.45, -0.85, 4.3], [-1.45, 1.6, 4.5]];  // ball centre at the moment of catch/throw
const ON_HAND = [0, 0, REST.ballR + 0.1];
const mod = (a, b) => ((a % b) + b) % b;

function arc(p0, p1, T, t) {
  const v = add(mul(sub(p1, p0), 1 / T), [0, 0, GRAV * T / 2]);
  const p = add(p0, mul(v, t));
  p[2] -= 0.5 * GRAV * t * t;
  return p;
}

// s = time since this ball was last thrown high
const ballPhase = (i, t) => mod(t + LOOP * i, HIGH + LOW);
function ballPos(i, t) {
  const s = ballPhase(i, t);
  return s < HIGH ? arc(BALL_AT[0], BALL_AT[1], HIGH, s) : arc(BALL_AT[1], BALL_AT[0], LOW, s - HIGH);
}

// Hands meet the ball exactly at each catch/throw and give a little in between:
// dip after the throw, come back up to meet the next ball.
function handPos(h, t) {
  const u = mod(t, LOOP) / LOOP;
  const p = sub(BALL_AT[h], ON_HAND);
  p[2] -= (h === 0 ? 0.28 : 0.2) * Math.sin(Math.PI * u);
  p[1] += SIDE[h] * 0.08 * Math.sin(Math.PI * u);
  return p;
}

// limb lengths from the rest pose
const L = {};
for (const k of ["legR", "legL", "armR", "armL"]) {
  const [a, b, c] = REST[k];
  L[k] = [dist(a, b), dist(b, c)];
}

// head orientation, smoothed over time so it can't snap
const look = { yaw: 0, pitch: 0 };
const HEAD_C = REST.head;
const local = (o, F, R, U) => add(add(mul(F, -o[0]), mul(R, o[1])), mul(U, o[2]));

function buildScene(t, dt = 0) {
  ns = 0;
  for (let i = 0; i < 3; i++) put(ballPos(i, t), REST.ballR, C_CHROME, MIRROR);

  const u = mod(t, LOOP) / LOOP;
  // knee dip between throws (body can only go down: one leg is fully straight at rest)
  const bob = -0.08 * Math.sin(Math.PI * u) ** 2;
  // upper body leans a touch toward the throwing hand as it throws, then recovers
  const lean = 0.05 * Math.sin(2 * Math.PI * u + 0.6);
  const PIV = 2.9;                                   // lean pivots at the hips
  const body = p => [p[0], p[1] + lean * (p[2] - PIV) * -1, p[2] + bob];

  // the head follows whichever ball is coming down from the high throw
  let target = null;
  for (let i = 0; i < 3; i++) {
    const s = ballPhase(i, t);
    if (s >= LOOP && s < HIGH) target = ballPos(i, t);
  }
  const hc = body(HEAD_C);
  if (target) {
    const d = sub(target, hc);
    const yaw = Math.max(-1.1, Math.min(1.1, Math.atan2(d[1], -d[0])));
    const pitch = Math.max(-0.35, Math.min(0.9, Math.atan2(d[2], Math.hypot(d[0], d[1]))));
    const k = 1 - Math.exp(-7 * dt);
    look.yaw += (yaw - look.yaw) * k;
    look.pitch += (pitch - look.pitch) * k;
  }
  const cp = Math.cos(look.pitch), sp = Math.sin(look.pitch);
  const F = [-cp * Math.cos(look.yaw), cp * Math.sin(look.yaw), sp];
  const R = norm(cross(F, [0, 0, 1]));
  const U = cross(R, F);
  const onHead = q => add(hc, local(sub(q, HEAD_C), F, R, U));

  put(hc, REST.headR, C_SKIN, BRIGHT);
  put(onHead(REST.hair), REST.hairR, C_HAIR, BRIGHT);
  put(onHead(REST.eyes[0]), REST.eyeR, C_EYE, BRIGHT);
  put(onHead(REST.eyes[1]), REST.eyeR, C_EYE, BRIGHT);
  put(body(REST.neck), REST.neckR, C_SKIN, BRIGHT);
  chain([body(REST.torsoTop), body(REST.torsoBot)], [REST.torsoTopR, REST.torsoBotR], [REST.torsoN], C_RED, BRIGHT);

  for (const k of ["legR", "legL"]) {
    const hip = body(REST[k][0]), foot = REST[k][2];
    const knee = ik(hip, foot, L[k][0], L[k][1], [-1, 0, 0.05]);
    chain([hip, knee, foot], [0.2, 0.2, 0.1], [6, 7], C_SKIN, BRIGHT);
  }
  ["armR", "armL"].forEach((k, h) => {
    const sh = body(REST[k][0]);
    const hand = handPos(h, t);
    const elbow = ik(sh, hand, L[k][0], L[k][1], [0.45, SIDE[h] * 1.0, -0.5]);
    chain([sh, elbow, hand], [0.2, 0.2, 0.1], [6, 7], C_SKIN, BRIGHT);
  });
  computeBounds();
}

// lamp exposure exactly like the original setup(): brightest sphere just reaches 1.0
function lampFactor() {
  buildScene(0);
  let f = 1e30;
  for (let i = 0; i < ns; i++) {
    const r = dist([sph[i * 4], sph[i * 4 + 1], sph[i * 4 + 2]], LAMP) - sph[i * 4 + 3];
    for (let k = 0; k < 3; k++) {
      const c = col[i * 4 + k];
      if (c === 0) continue;
      const t = (1 - c * 0.25) / (c / (r * r));
      if (t < f) f = t;
    }
  }
  return f;
}

// ---------------------------------------------------------------------------
// WebGL
// ---------------------------------------------------------------------------
const canvas = document.getElementById("c");
const gl = canvas.getContext("webgl2", { antialias: false, alpha: false, powerPreference: "high-performance" });
function fail(msg) {
  const e = document.getElementById("err");
  e.style.display = "grid"; e.textContent = msg;
  throw new Error(msg);
}
if (!gl) fail("This page needs WebGL2.");

function shader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src.trim());
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) fail("Shader error:\n" + gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, shader(gl.VERTEX_SHADER, document.getElementById("vs").textContent));
gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, document.getElementById("fs").textContent));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) fail("Link error:\n" + gl.getProgramInfoLog(prog));
gl.useProgram(prog);
gl.bindVertexArray(gl.createVertexArray());
const U = {};
for (const n of ["uRes", "uCam", "uFwd", "uRight", "uUp", "uFl", "uPlane", "uQuant", "uFilter", "uPixAng", "uSamples", "uLampK", "uSph", "uCol", "uGB", "uGR"])
  U[n] = gl.getUniformLocation(prog, n);
gl.uniform1f(U.uFl, FOCAL);
gl.uniform1f(U.uLampK, lampFactor());
gl.uniform2iv(U.uGR, new Int32Array(GROUPS.flat()));

// ---------------------------------------------------------------------------
// Orbit camera (starts at the original 1986 framing)
// ---------------------------------------------------------------------------
const d2r = Math.PI / 180;
const viewDir = [Math.cos(AZ * d2r) * Math.cos(ALT * d2r), Math.sin(AZ * d2r) * Math.cos(ALT * d2r), Math.sin(ALT * d2r)];
const TARGET = add(OBS, mul(viewDir, 10.8));
const home = (() => {
  const v = sub(OBS, TARGET), d = len(v);
  return { yaw: Math.atan2(v[1], v[0]), pitch: Math.asin(v[2] / d), dist: d };
})();
const cam = { ...home };

const pointers = new Map();
let pinch0 = 0, dist0 = 0;
canvas.addEventListener("pointerdown", e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinch0 = Math.hypot(a[0] - b[0], a[1] - b[1]); dist0 = cam.dist;
  }
});
canvas.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId);
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if (pointers.size === 1) {
    cam.yaw -= (e.clientX - prev[0]) * 0.006;
    cam.pitch += (e.clientY - prev[1]) * 0.006;
    cam.pitch = Math.max(-0.25, Math.min(1.45, cam.pitch));
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    if (pinch0 > 0) cam.dist = Math.max(3, Math.min(60, dist0 * pinch0 / d));
  }
});
const up = e => { pointers.delete(e.pointerId); pinch0 = 0; };
canvas.addEventListener("pointerup", up);
canvas.addEventListener("pointercancel", up);
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  cam.dist = Math.max(3, Math.min(60, cam.dist * Math.exp(e.deltaY * 0.001)));
}, { passive: false });
canvas.addEventListener("dblclick", () => Object.assign(cam, home));

// ---------------------------------------------------------------------------
// Playback controls
// ---------------------------------------------------------------------------
const SPEEDS = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 2, 2.5, 3, 4]; // keys 0..9; 3 = original 1986 speed
let speedKey = 3, paused = false;
addEventListener("keydown", e => {
  startAudio();
  if (e.key === " ") { paused = !paused; e.preventDefault(); }
  else if (/^[0-9]$/.test(e.key)) speedKey = +e.key;
  else if (e.key === "m" || e.key === "M") muted = !muted;
  else if (e.key === "h" || e.key === "H") setHud(!hudOpen);
  else if (e.key === "r" || e.key === "R") setMode((modeIdx + (e.shiftKey ? MODES.length - 1 : 1)) % MODES.length);
});

// collapsible control panel (remembered per browser)
const hudEl = document.getElementById("hud"), hudToggle = document.getElementById("hudToggle");
let hudOpen = true;
try { hudOpen = localStorage.getItem("juggler.hud") !== "closed"; } catch (e) {}
function setHud(open) {
  hudOpen = open;
  hudEl.classList.toggle("collapsed", !open);
  hudToggle.textContent = open ? "▾" : "▸";
  hudToggle.setAttribute("aria-expanded", open);
  hudToggle.title = open ? "Hide controls (H)" : "Show controls (H)";
  try { localStorage.setItem("juggler.hud", open ? "open" : "closed"); } catch (e) {}
}
hudToggle.addEventListener("click", () => setHud(!hudOpen));
setHud(hudOpen);

// ---------------------------------------------------------------------------
// Render modes: from the real 1986 pipeline to the best a modern GPU can do.
// ---------------------------------------------------------------------------
const MODES = [
  { id: "1986",  label: "1986 HAM", tip: "320×200, 4:3, 30 fps, Hold-And-Modify encoded exactly like Eric Graham's ham2()" },
  { id: "lores", label: "320×200",  tip: "Original resolution and framing, 12-bit color, no HAM fringing" },
  { id: "auto",  label: "Auto",     tip: "Full window, resolution adapts to keep it smooth" },
  { id: "best",  label: "Best",     tip: "Full device resolution with 4× anti-aliasing" },
];
let modeIdx = 2;
try { const m = MODES.findIndex(x => x.id === localStorage.getItem("juggler.mode")); if (m >= 0) modeIdx = m; } catch (e) {}
const modesEl = document.getElementById("modes");
MODES.forEach((m, i) => {
  const b = document.createElement("button");
  b.textContent = m.label; b.title = m.tip;
  b.addEventListener("click", () => setMode(i));
  modesEl.appendChild(b);
});
const hamCanvas = document.getElementById("ham");
const hamCtx = hamCanvas.getContext("2d");
const hamImg = hamCtx.createImageData(320, 200);
const hamSrc = new Uint8Array(320 * 200 * 4);
let lastRetro = -1e9;
function setMode(i) {
  modeIdx = i;
  try { localStorage.setItem("juggler.mode", MODES[i].id); } catch (e) {}
  [...modesEl.children].forEach((b, k) => b.setAttribute("aria-pressed", k === i));
  canvas.classList.toggle("pixelated", i <= 1);
  hamCanvas.style.display = MODES[i].id === "1986" ? "block" : "none";
  layout();
  lastRetro = -1e9;
}
// retro modes show the 4:3 frame letterboxed, like a 1986 monitor
function layout() {
  const retro = modeIdx <= 1;
  let cw = innerWidth, ch = innerHeight, x = 0, y = 0;
  if (retro) {
    if (cw / ch > 4 / 3) cw = Math.round(ch * 4 / 3); else ch = Math.round(cw * 3 / 4);
    x = Math.round((innerWidth - cw) / 2); y = Math.round((innerHeight - ch) / 2);
  }
  for (const el of [canvas, hamCanvas])
    Object.assign(el.style, { left: x + "px", top: y + "px", width: cw + "px", height: ch + "px" });
}
addEventListener("resize", layout);

// Eric Graham's ham2()/nearestp()/coldist() from rt3.c: the palette starts as black + white,
// grows up to 16 registers per image, and every other pixel modifies one channel of its
// left neighbour - which produces the characteristic HAM color fringing.
function hamEncode(src, img, W, H) {
  const creg = new Int32Array(48); creg[3] = creg[4] = creg[5] = 15;
  let nalloc = 2;
  const pix = [0, 0, 0], prev = [0, 0, 0];
  const nearest = () => {
    let md = 32000, best = 0;
    for (let r = 0; r < nalloc; r++) {
      const d = Math.abs(pix[0] - creg[r * 3]) + Math.abs(pix[1] - creg[r * 3 + 1]) + Math.abs(pix[2] - creg[r * 3 + 2]);
      if (d < md) { md = d; best = r; }
    }
    if (md > 4 && nalloc < 16) {
      creg[nalloc * 3] = pix[0]; creg[nalloc * 3 + 1] = pix[1]; creg[nalloc * 3 + 2] = pix[2];
      best = nalloc++; md = 0;
    }
    return [best, md];
  };
  for (let j = 0; j < H; j++) {
    const sRow = (H - 1 - j) * W * 4, dRow = j * W * 4;     // GL rows are bottom-up
    for (let i = 0; i < W; i++) {
      const si = sRow + i * 4;
      for (let k = 0; k < 3; k++) pix[k] = Math.min(15, Math.max(0, Math.floor(16 * src[si + k] / 255 + 0.5)));
      let pen = -1;
      if (i === 0) pen = nearest()[0];
      else {
        let r = 0, m = 0;
        for (let k = 0; k < 3; k++) { const d = Math.abs(pix[k] - prev[k]); r += d; if (d > m) m = d; }
        const dif = r - m;
        if (dif) { const [p, d2] = nearest(); if (d2 < dif) pen = p; }
      }
      if (pen >= 0) { prev[0] = creg[pen * 3]; prev[1] = creg[pen * 3 + 1]; prev[2] = creg[pen * 3 + 2]; }
      else {
        let id = 0, md = 0;
        for (let k = 0; k < 3; k++) { const d = Math.abs(pix[k] - prev[k]); if (d > md) { md = d; id = k; } }
        prev[id] = pix[id];
      }
      const di = dRow + i * 4;
      img.data[di] = prev[0] * 17; img.data[di + 1] = prev[1] * 17; img.data[di + 2] = prev[2] * 17; img.data[di + 3] = 255;
    }
  }
}

// ---------------------------------------------------------------------------
// The "clink": synthesized to match the original Amiga sound, a ~1 kHz tone that
// decays over half a second, played once per 0.8 s loop. Browsers only allow audio
// after a user gesture, so it starts on first input.
// ---------------------------------------------------------------------------
const CLINK_HZ = 1010, CLINK_LEN = 0.5, CLINK_DECAY = 0.13;   // Hz, seconds, seconds
let actx = null, clinkBuf = null, muted = false;
function startAudio() {
  if (actx) { if (actx.state === "suspended") actx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  actx = new AC();
  const rate = actx.sampleRate;
  clinkBuf = actx.createBuffer(1, Math.round(CLINK_LEN * rate), rate);
  const ch = clinkBuf.getChannelData(0);
  for (let i = 0; i < ch.length; i++) {
    const t = i / rate;
    const env = Math.min(1, t / 0.002) * Math.exp(-t / CLINK_DECAY) * Math.min(1, (CLINK_LEN - t) / 0.02);
    ch[i] = 0.32 * env * Math.sin(2 * Math.PI * CLINK_HZ * t);
  }
}
addEventListener("pointerdown", startAudio);
function ting(pan, level = 1) {
  if (!actx || !clinkBuf || muted || actx.state !== "running") return;
  const src = actx.createBufferSource();
  src.buffer = clinkBuf;
  const g = actx.createGain();
  g.gain.value = 0.8 * level;
  src.connect(g);
  let node = g;
  if (actx.createStereoPanner) {
    const p = actx.createStereoPanner();
    p.pan.value = Math.max(-1, Math.min(1, pan));
    g.connect(p); node = p;
  }
  node.connect(actx.destination);
  src.start();
}

// ---------------------------------------------------------------------------
// Frame loop with adaptive resolution
// ---------------------------------------------------------------------------
let simT = 0, last = performance.now(), lastSceneT = 0;
let scale = Math.min(devicePixelRatio || 1, 1.5);
const MAX_SCALE = Math.min(devicePixelRatio || 1, 2);
let ftAcc = 0, ftN = 0, fps = 0;
let bestScale = MAX_SCALE, rendAcc = 0, rendN = 0, rendFps = 0, lastRender = 0;

function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.25);
  last = now;
  const prevT = simT;
  if (!paused) simT += dt * SPEEDS[speedKey];

  const mode = MODES[modeIdx].id, retro = mode === "1986" || mode === "lores";

  // adapt resolution roughly every half second (Auto mode only)
  ftAcc += dt; ftN++;
  if (ftAcc > 0.5) {
    const avg = ftAcc / ftN * 1000;
    fps = 1000 / avg;
    if (mode === "auto") {
      if (avg > 24) scale = Math.max(0.3, scale * 0.85);
      else if (avg < 18) scale = Math.min(MAX_SCALE, scale * 1.06);
    }
    ftAcc = 0; ftN = 0;
  }
  // Best: 4x anti-aliasing at a steady 30 fps; resolution backs off if frames run long
  if (rendN >= 8) {
    const avg = rendAcc / rendN * 1000;
    rendFps = 1000 / avg;
    if (mode === "best") {
      if (avg > 37) bestScale = Math.max(0.35, bestScale * 0.9);
      else if (avg < 34.5) bestScale = Math.min(MAX_SCALE, bestScale * 1.03);
    }
    rendAcc = 0; rendN = 0;
  }
  const s = mode === "best" ? bestScale : scale;
  const w = retro ? 320 : Math.max(1, Math.round(innerWidth * s));
  const h = retro ? 200 : Math.max(1, Math.round(innerHeight * s));

  // camera basis (z up)
  const cp = Math.cos(cam.pitch);
  const pos = add(TARGET, mul([cp * Math.cos(cam.yaw), cp * Math.sin(cam.yaw), Math.sin(cam.pitch)], cam.dist));
  if (pos[2] < 0.15) pos[2] = 0.15;
  const fwd = norm(sub(TARGET, pos));
  const right = norm(cross(fwd, [0, 0, 1]));
  const upv = cross(right, fwd);

  // every LOOP both hands catch at once (high ball and low pass): one clink
  const c0 = Math.floor(prevT / LOOP), c1 = Math.floor(simT / LOOP);
  if (c1 > c0 && c1 - c0 < 3) {
    ting(0, 1);   // one clink per loop, mono, like the original
  }

  // the original played at 30 fps; retro modes (and Best, to leave room for 4x AA)
  // only draw a new frame every 1/30 s. (Resize only when drawing: it clears the canvas.)
  if ((retro || mode === "best") && now - lastRetro < 1000 / 30 - 2) { requestAnimationFrame(frame); return; }
  lastRetro = now;
  if (lastRender) { rendAcc += Math.min((now - lastRender) / 1000, 0.25); rendN++; }
  lastRender = now;
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  gl.viewport(0, 0, w, h);

  buildScene(simT, simT - lastSceneT);
  lastSceneT = simT;
  gl.uniform2f(U.uRes, w, h);
  gl.uniform3fv(U.uCam, pos);
  gl.uniform3fv(U.uFwd, fwd);
  gl.uniform3fv(U.uRight, right);
  gl.uniform3fv(U.uUp, upv);
  // retro: the exact 1.0 x 0.75 plane on 320x200 non-square pixels; otherwise keep the
  // 4:3 frame visible and extend it to fill the window
  const vh = retro ? 0.75 : Math.max(0.75, h / w);
  const vw = retro ? 1.0 : vh * w / h;
  gl.uniform2f(U.uPlane, vw, vh);
  gl.uniform1f(U.uFilter, retro ? 0 : 1);
  gl.uniform1i(U.uQuant, mode === "lores" ? 1 : 0);
  gl.uniform1f(U.uPixAng, vh / h / FOCAL);
  gl.uniform1i(U.uSamples, mode === "best" ? 4 : 1);
  gl.uniform4fv(U.uSph, sph);
  gl.uniform4fv(U.uCol, col);
  gl.uniform4fv(U.uGB, gb);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  if (mode === "1986") {
    gl.readPixels(0, 0, 320, 200, gl.RGBA, gl.UNSIGNED_BYTE, hamSrc);
    hamEncode(hamSrc, hamImg, 320, 200);
    hamCtx.putImageData(hamImg, 0, 0);
  }

  document.getElementById("stats").textContent =
    `${MODES[modeIdx].label} · ${retro || mode === "best" ? rendFps.toFixed(0) : fps.toFixed(0)} fps · ${w}×${h}${mode === "best" ? " ×4 AA" : ""} · speed ${SPEEDS[speedKey]}×${paused ? " · paused" : ""}`;
  requestAnimationFrame(frame);
}
setMode(modeIdx);
requestAnimationFrame(frame);
</script>
</body>
</html>
